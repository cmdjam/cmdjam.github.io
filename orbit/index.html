  <style>
/* Tokens from docs/design-spec.md. Orbit is dark-only by design. */
:root {
  color-scheme: dark;
  --space-void: #07090F;
  --space-card: #141826;
  --space-lift: #1C2235;
  --accent: #7B8FFF;
  /* Button fill: white text stays at or above 4.5:1 across the gradient. */
  --accent-fill-top: #5366EE;
  --accent-strong: #3F52D9;
  --accent-soft: rgba(123, 143, 255, 0.14);
  --text-primary: #F0F2FA;
  --text-secondary: #8891AA;
  --text-dim: #5A627A;
  --hairline: rgba(255, 255, 255, 0.05);
  --border: rgba(255, 255, 255, 0.08);
  --danger: #F87171;

  --thriving: #16A34A;  --thriving-hl: #86EFAC;  --thriving-fg: #4ADE80;
  --drifting: #D97706;  --drifting-hl: #FDE68A;  --drifting-fg: #FCD34D;
  --neglected: #C2410C; --neglected-hl: #FDBA74; --neglected-fg: #FB923C;
  --estranged: #1A1A22; --estranged-hl: #555560; --estranged-fg: #9CA3AF;

  --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --serif: 'DM Serif Display', Georgia, 'Times New Roman', serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* Health colour as a single custom property per element. */
.h-thriving  { --hc: var(--thriving-fg);  --hc-base: var(--thriving);  --hc-hl: var(--thriving-hl); }
.h-drifting  { --hc: var(--drifting-fg);  --hc-base: var(--drifting);  --hc-hl: var(--drifting-hl); }
.h-neglected { --hc: var(--neglected-fg); --hc-base: var(--neglected); --hc-hl: var(--neglected-hl); }
.h-estranged { --hc: var(--estranged-fg); --hc-base: var(--estranged); --hc-hl: var(--estranged-hl); }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 0%, #0D1222, #030408 70%);
  color: var(--text-primary);
  font: 400 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: 0.4; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page:focus, .sheet:focus, .dialog:focus { outline: none; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
.icon { display: inline-grid; place-items: center; flex: none; line-height: 0; }

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
/* Keyboard users can still tab into the planet list. */
.sr-only:focus-within {
  position: absolute; width: auto; height: auto; clip: auto; z-index: 5;
  top: 96px; left: 16px; right: 16px; padding: 8px;
  background: var(--space-card); border: 1px solid var(--border); border-radius: 14px;
}
.sr-only:focus-within button { display: block; width: 100%; text-align: left; padding: 8px 6px; }

/* ── Phone frame: full-bleed on mobile, centred device on desktop ─────── */
.phone {
  position: relative;
  height: 100%;
  max-width: 440px;
  margin: 0 auto;
  overflow: hidden;
  background: var(--space-void);
  isolation: isolate;
}
@media (min-width: 600px) and (min-height: 700px) {
  .phone {
    height: min(880px, calc(100% - 48px));
    margin-top: max(24px, calc((100vh - 880px) / 2));
    border-radius: 36px;
    box-shadow: 0 0 0 1px var(--border), 0 0 0 9px #0B0E16, 0 0 0 10px rgba(255, 255, 255, 0.06),
                0 40px 100px rgba(0, 0, 0, 0.7), 0 0 120px rgba(123, 143, 255, 0.06);
  }
}

/* ── Typography ─────────────────────────────────────────────────────────── */
.canvas-title { font: 400 26px/1.1 var(--serif); letter-spacing: -0.01em; }
.sheet-title { font-size: 16px; font-weight: 600; }
.body-secondary { font-size: 13px; color: var(--text-secondary); }
.body-dim { font-size: 12px; color: var(--text-dim); }
.meta-label, .field-label {
  font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-dim);
}
.center { text-align: center; }
.pad { padding: 48px 0; }

/* ── Buttons ────────────────────────────────────────────────────────────── */
.icon-button {
  width: 38px; height: 38px; border-radius: 12px;
  background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
  color: var(--text-secondary);
  display: grid; place-items: center; position: relative;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: color 150ms, background 150ms;
}
.icon-button:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.08); }
/* 48px minimum touch target around small visuals. */
.icon-button::after, .fab::after { content: ''; position: absolute; inset: -5px; }
.text-button { color: var(--text-secondary); font-size: 14px; min-height: 48px; min-width: 48px; padding: 0 4px; }
.text-button:hover { color: var(--text-primary); }
.text-button.with-icon { display: inline-flex; align-items: center; gap: 2px; margin-left: -6px; }
.text-button.accent { color: var(--accent); font-weight: 600; }
.text-button.danger { color: var(--danger); font-weight: 600; }
.link-button {
  color: var(--text-secondary); font-size: 12.5px;
  text-decoration: underline; text-decoration-color: var(--text-dim); text-underline-offset: 3px;
  padding: 10px 8px; min-height: 48px;
}
.link-button:hover { color: var(--text-primary); }
.primary-button {
  width: 100%; min-height: 52px; border-radius: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(180deg, var(--accent-fill-top), var(--accent-strong));
  color: #fff; font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
  box-shadow: 0 8px 24px rgba(99, 119, 245, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  transition: transform 120ms, box-shadow 150ms;
}
.primary-button:not(:disabled):active { transform: scale(0.98); }
.primary-button:disabled { background: var(--space-lift); box-shadow: none; color: var(--text-dim); opacity: 1; }
.pill-button {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 24px;
  background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px;
  border: 1px solid rgba(123, 143, 255, 0.3);
}

/* ── Orbit screen ───────────────────────────────────────────────────────── */
.orbit-screen { position: absolute; inset: 0; }
.orbit-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.orbit-appbar {
  position: absolute; top: calc(var(--safe-top) + 10px); left: 0; right: 0;
  padding: 8px 20px; display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none;
}
.orbit-appbar > * { pointer-events: auto; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-secondary); }
.legend-item .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hc); box-shadow: 0 0 6px var(--hc); }
.legend-item.h-estranged .dot { background: var(--estranged-hl); box-shadow: none; }
.legend-count { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

.user-node {
  position: absolute; left: 50%; top: 87%;
  width: 48px; height: 48px; margin: -24px 0 0 -24px;
  pointer-events: none; z-index: 1;
}
.user-core {
  position: absolute; inset: 0; border-radius: 50%;
  display: grid; place-items: center; color: rgba(255, 255, 255, 0.92);
  background: radial-gradient(circle at 35% 30%, #C3CEFF, #6B7FFF 45%, #3446C8);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18) inset,
              0 0 0 6px rgba(123, 143, 255, 0.12),
              0 0 28px rgba(123, 143, 255, 0.45), 0 0 70px rgba(123, 143, 255, 0.18);
}
.user-pulse {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid rgba(123, 143, 255, 0.5);
  animation: pulse 3.2s var(--ease-out) infinite;
}
@keyframes pulse { from { transform: scale(1); opacity: 0.8; } to { transform: scale(2.6); opacity: 0; } }
.orbit-screen.is-empty .user-node { top: 87%; }

.fab {
  position: absolute; right: 18px; bottom: calc(var(--safe-bottom) + 84px);
  width: 52px; height: 52px; border-radius: 18px;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(180deg, var(--accent-fill-top), var(--accent-strong));
  box-shadow: 0 8px 24px rgba(99, 119, 245, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  z-index: 2; transition: transform 120ms;
}
.fab:active { transform: scale(0.94); }

.empty-state {
  position: absolute; top: 30%; left: 24px; right: 24px; text-align: center;
  display: grid; gap: 6px; justify-items: center;
}
.empty-orb {
  width: 64px; height: 64px; margin-bottom: 12px; border-radius: 50%;
  border: 1px dashed rgba(123, 143, 255, 0.4);
  background: radial-gradient(circle, rgba(123, 143, 255, 0.12), transparent 70%);
}
.empty-title { font: 400 22px/1.2 var(--serif); }

.bottom-nav {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: calc(76px + var(--safe-bottom));
  padding: 0 24px calc(var(--safe-bottom) + 10px);
  display: flex; justify-content: space-around; align-items: flex-end;
  background: linear-gradient(to bottom, rgba(7, 9, 15, 0), rgba(7, 9, 15, 0.96) 55%);
  z-index: 2;
}
.nav-item {
  position: relative; display: grid; justify-items: center; gap: 4px;
  min-width: 72px; min-height: 52px; align-content: end; padding-bottom: 4px;
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.02em;
  color: var(--text-secondary); opacity: 0.55; transition: opacity 150ms, color 150ms;
}
.nav-item:hover { opacity: 0.85; }
.nav-item.active { color: var(--accent); opacity: 1; }
.nav-item.active::before {
  content: ''; position: absolute; top: 2px; width: 32px; height: 32px; border-radius: 12px;
  background: var(--accent-soft); z-index: -1;
}

/* ── Pages ──────────────────────────────────────────────────────────────── */
.page-layer:empty, .overlay-layer:empty { display: none; }
.page {
  position: absolute; inset: 0; z-index: 3;
  background: radial-gradient(ellipse at 50% -10%, rgba(123, 143, 255, 0.08), transparent 55%), var(--space-void);
  display: flex; flex-direction: column;
  padding-top: var(--safe-top);
  animation: page-in 220ms var(--ease-out);
}
@keyframes page-in { from { opacity: 0; transform: translateY(10px); } }
.page.with-nav { padding-bottom: calc(76px + var(--safe-bottom)); }
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 12px; gap: 12px; min-height: 68px;
}
.page-header .spacer { width: 52px; }
.page-scroll { flex: 1; overflow-y: auto; padding: 4px 20px 24px; scrollbar-width: thin; scrollbar-color: var(--space-lift) transparent; }
.page-footer { padding: 8px 20px calc(var(--safe-bottom) + 16px); }

/* Add contact */
.add-contact .field-label { display: block; margin: 22px 0 8px; }
.add-contact .field-label:first-child { margin-top: 8px; }
.input {
  width: 100%; background: var(--space-lift);
  border: 1px solid var(--hairline); border-radius: 14px;
  padding: 13px 15px; color: var(--text-primary); font-size: 15px;
  outline: none; resize: none; transition: border-color 150ms, box-shadow 150ms;
}
.input::placeholder { color: var(--text-dim); }
.input:focus { border-color: rgba(123, 143, 255, 0.55); box-shadow: 0 0 0 4px rgba(123, 143, 255, 0.1); }
.cadence-picker { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.stepper {
  display: flex; align-items: center; background: var(--space-lift);
  border: 1px solid var(--hairline); border-radius: 14px;
}
.stepper:focus-within { border-color: rgba(123, 143, 255, 0.55); }
.stepper button { width: 48px; height: 48px; color: var(--text-secondary); font-size: 18px; }
.stepper button:hover { color: var(--text-primary); }
.cadence-number {
  width: 40px; background: none; border: 0; outline: none; padding: 0;
  text-align: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.chips { display: flex; gap: 4px; padding: 4px; background: var(--space-lift); border: 1px solid var(--hairline); border-radius: 14px; }
.chip {
  flex: 1; border-radius: 10px; color: var(--text-secondary);
  font-size: 13px; min-height: 40px; transition: background 150ms, color 150ms;
  position: relative;
}
/* The group's 4px padding completes the 48px target. */
.chip::after { content: ''; position: absolute; inset: -4px 0; }
.chip:hover { color: var(--text-primary); }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px rgba(123, 143, 255, 0.35); }
.field-error { color: var(--danger); font-size: 12px; margin-top: 6px; }
.cadence-preview {
  display: flex; align-items: center; gap: 10px;
  margin-top: 10px; padding: 12px 14px; border-radius: 14px;
  background: linear-gradient(90deg, rgba(123, 143, 255, 0.1), transparent);
  border: 1px solid rgba(123, 143, 255, 0.15);
  color: var(--text-primary); font-size: 13.5px;
}
.cadence-preview .orbit-hint { color: var(--text-secondary); margin-left: auto; font-size: 12px; }
.field-label-row { display: flex; justify-content: space-between; align-items: baseline; }
.note-counter { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.note-counter.near { color: var(--drifting-fg); }

/* Onboarding */
.onboarding { justify-content: space-between; padding: calc(var(--safe-top) + 56px) 24px calc(var(--safe-bottom) + 20px); overflow: hidden; }
.onboarding-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 62%; z-index: -1;
  -webkit-mask-image: linear-gradient(#000 85%, transparent); mask-image: linear-gradient(#000 85%, transparent); }
.onboarding-body { text-align: center; }
.onboarding-title { font: 400 52px/1 var(--serif); letter-spacing: -0.02em; text-shadow: 0 0 40px rgba(123, 143, 255, 0.35); }
.onboarding-tagline { margin-top: 12px; font: italic 400 21px/1.3 var(--serif); color: var(--text-secondary); }
.onboarding-card {
  padding: 20px 18px 6px; border-radius: 24px;
  background: rgba(20, 24, 38, 0.72); border: 1px solid var(--border);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.value-props { display: grid; gap: 14px; }
.value-prop { display: flex; gap: 12px; align-items: center; color: var(--text-primary); font-size: 14px; }
.value-icon {
  flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.onboarding-legend { justify-content: center; margin: 18px 0 16px; }
.onboarding-actions { display: grid; justify-items: center; }

/* People */
.people-group + .people-group { margin-top: 18px; }
.group-title {
  display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--hc);
}
.group-title .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hc); }
.group-count { color: var(--text-dim); font-weight: 500; }
.person-row, .settings-row {
  width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
  padding: 12px 0; border-bottom: 1px solid var(--hairline); min-height: 60px;
}
.person-row:hover .person-name { color: #fff; }
.person-text { flex: 1; display: grid; gap: 5px; min-width: 0; }
.person-line { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.person-name { font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person-when { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.person-sub { font-size: 12px; color: var(--text-dim); }
.settings-list { margin-top: 16px; }
.settings-row { cursor: pointer; }
.settings-row.danger { color: var(--danger); }
.app-version { margin-top: 24px; text-align: center; font-size: 12px; }

/* ── Health visuals ─────────────────────────────────────────────────────── */
.avatar {
  flex: none; width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 600; font-size: 22px; color: rgba(255, 255, 255, 0.92);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  background:
    radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.35), transparent 40%),
    radial-gradient(circle at 75% 80%, rgba(2, 3, 10, 0.45), transparent 60%),
    radial-gradient(circle at 35% 35%, var(--hc-hl), var(--hc-base));
  box-shadow: 0 0 22px color-mix(in srgb, var(--hc) 40%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--hc) 40%, transparent);
}
.avatar.h-estranged { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); }
.avatar.small { width: 38px; height: 38px; font-size: 14px; box-shadow: 0 0 12px color-mix(in srgb, var(--hc) 30%, transparent); }
.avatar.small.h-estranged { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); }

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
  color: var(--hc); background: color-mix(in srgb, var(--hc) 13%, transparent);
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.meter { position: relative; display: flex; height: 8px; border-radius: 4px; gap: 2px; }
.meter.compact { height: 4px; gap: 1px; }
.meter-zone { height: 100%; background: var(--hc); opacity: 0.22; }
.meter-zone:first-child { border-radius: 4px 0 0 4px; }
.meter-zone:last-child { border-radius: 0 4px 4px 0; }
.meter-zone.h-estranged { background: var(--estranged-fg); opacity: 0.16; }
.meter-zone.current { opacity: 0.6; }
.meter.empty .meter-zone { opacity: 0.1; }
.meter-marker {
  position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 3px var(--hc), 0 0 12px var(--hc);
}
.meter.compact .meter-marker { width: 8px; height: 8px; margin: -4px 0 0 -4px; box-shadow: 0 0 0 2px var(--hc); }
.meter-scale { position: relative; display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; color: var(--text-dim); }
.meter-scale span[style] { position: absolute; transform: translateX(-50%); }

/* ── Sheets & dialogs ───────────────────────────────────────────────────── */
.sheet-layer, .dialog-layer { position: absolute; inset: 0; z-index: 10; }
.backdrop {
  position: absolute; inset: 0; background: rgba(3, 4, 8, 0.5); opacity: 0;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  transition: opacity 220ms;
}
.sheet-layer.open .backdrop, .dialog-layer .backdrop { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: 88%;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(28, 34, 53, 0.96), rgba(20, 24, 38, 0.98) 120px);
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 28px 28px 0 0;
  box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  transform: translateY(100%);
  transition: transform 300ms var(--ease-out);
}
.sheet-layer.open .sheet { transform: none; }
.sheet-layer.no-anim .sheet, .sheet-layer.no-anim .backdrop { transition: none; }
.sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.18); margin: 10px auto 18px; flex: none; }
.sheet-scroll { overflow-y: auto; padding: 0 20px 8px; display: grid; gap: 14px; scrollbar-width: thin; scrollbar-color: var(--space-lift) transparent; }
.sheet-body { padding: 8px 20px 32px; }
.sheet-footer { padding: 10px 20px calc(var(--safe-bottom) + 16px); }

.hero { display: flex; align-items: center; gap: 16px; }
.hero-name { font: 400 26px/1.15 var(--serif); margin-bottom: 6px; }

.rhythm { padding: 14px 14px 12px; border-radius: 16px; background: var(--space-lift); border: 1px solid var(--hairline); }
.rhythm-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.rhythm-caption { font-size: 13px; font-weight: 500; color: var(--hc); }
.rhythm-caption.h-estranged { color: var(--estranged-fg); }
