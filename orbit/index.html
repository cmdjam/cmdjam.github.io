/* Tokens from docs/design-spec.md. Orbit is dark-only by design. */
:root {
  color-scheme: dark;
  --space-void: #07090F;
  --space-card: #141826;
  --space-lift: #1C2235;
  --accent: #7B8FFF;
  /* Button fill: white text stays at or above 4.5:1 across the gradient. */
  --accent-fill-top: #5366EE;
  --accent-strong: #3F52D9;
  --accent-soft: rgba(123, 143, 255, 0.14);
  --text-primary: #F0F2FA;
  --text-secondary: #8891AA;
  /* Decoration only (underlines, disabled controls): 2.6–3.3:1, below AA for text. */
  --text-dim: #5A627A;
  --hairline: rgba(255, 255, 255, 0.05);
  --border: rgba(255, 255, 255, 0.08);
  --danger: #F87171;

  --thriving: #16A34A;  --thriving-hl: #86EFAC;  --thriving-fg: #4ADE80;
  --drifting: #D97706;  --drifting-hl: #FDE68A;  --drifting-fg: #FCD34D;
  --neglected: #C2410C; --neglected-hl: #FDBA74; --neglected-fg: #FB923C;
  --estranged: #1A1A22; --estranged-hl: #555560; --estranged-fg: #9CA3AF;

  --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --serif: 'DM Serif Display', Georgia, 'Times New Roman', serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* Health colour as a single custom property per element. */
.h-thriving  { --hc: var(--thriving-fg);  --hc-base: var(--thriving);  --hc-hl: var(--thriving-hl); }
.h-drifting  { --hc: var(--drifting-fg);  --hc-base: var(--drifting);  --hc-hl: var(--drifting-hl); }
.h-neglected { --hc: var(--neglected-fg); --hc-base: var(--neglected); --hc-hl: var(--neglected-hl); }
.h-estranged { --hc: var(--estranged-fg); --hc-base: var(--estranged); --hc-hl: var(--estranged-hl); }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 0%, #0D1222, #030408 70%);
  color: var(--text-primary);
  font: 400 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  /* No overflow: hidden here: a page that can't scroll at all gets no browser pull-to-refresh.
     The frame fits the screen, so nothing scrolls; flow-root keeps the desktop frame's top
     margin inside body instead of pushing body down past the window. */
  display: flow-root;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: 0.4; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page:focus, .sheet:focus, .dialog:focus { outline: none; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
.icon { display: inline-grid; place-items: center; flex: none; line-height: 0; }

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
/* Keyboard users can still tab into the planet list. */
.sr-only:focus-within {
  position: absolute; width: auto; height: auto; clip: auto; z-index: 5;
  top: 96px; left: 16px; right: 16px; padding: 8px;
  background: var(--space-card); border: 1px solid var(--border); border-radius: 14px;
}
.sr-only:focus-within button { display: block; width: 100%; text-align: left; padding: 8px 6px; }

/* ── Phone frame: full-bleed on mobile, centred device on desktop ─────── */
.phone {
  position: relative;
  height: 100%;
  max-width: 440px;
  margin: 0 auto;
  overflow: hidden;
  background: var(--space-void);
  isolation: isolate;
}
@media (min-width: 600px) and (min-height: 700px) {
  .phone {
    height: min(880px, calc(100% - 48px));
    margin-top: max(24px, calc((100vh - 880px) / 2));
    border-radius: 36px;
    box-shadow: 0 0 0 1px var(--border), 0 0 0 9px #0B0E16, 0 0 0 10px rgba(255, 255, 255, 0.06),
                0 40px 100px rgba(0, 0, 0, 0.7), 0 0 120px rgba(123, 143, 255, 0.06);
  }
}

/* ── Typography ─────────────────────────────────────────────────────────── */
.canvas-title { font: 400 26px/1.1 var(--serif); letter-spacing: -0.01em; }
.sheet-title { font-size: 16px; font-weight: 600; }
.body-secondary { font-size: 13px; color: var(--text-secondary); }
.body-dim { font-size: 12px; color: var(--text-secondary); }
.meta-label, .field-label {
  font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-secondary);
}
.center { text-align: center; }
.pad { padding: 48px 0; }

/* ── Buttons ────────────────────────────────────────────────────────────── */
.icon-button {
  width: 38px; height: 38px; border-radius: 12px;
  background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
  color: var(--text-secondary);
  display: grid; place-items: center; position: relative;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: color 150ms, background 150ms;
}
.icon-button:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.08); }
/* 48px minimum touch target around small visuals. */
.icon-button::after, .fab::after { content: ''; position: absolute; inset: -5px; }
.text-button { color: var(--text-secondary); font-size: 14px; min-height: 48px; min-width: 48px; padding: 0 4px; }
.text-button:hover { color: var(--text-primary); }
.text-button.with-icon { display: inline-flex; align-items: center; gap: 2px; margin-left: -6px; }
.text-button.accent { color: var(--accent); font-weight: 600; }
.text-button.danger { color: var(--danger); font-weight: 600; }
.link-button {
  color: var(--text-secondary); font-size: 12.5px;
  text-decoration: underline; text-decoration-color: var(--text-dim); text-underline-offset: 3px;
  padding: 10px 8px; min-height: 48px;
}
.link-button:hover { color: var(--text-primary); }
.primary-button {
  width: 100%; min-height: 52px; border-radius: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(180deg, var(--accent-fill-top), var(--accent-strong));
  color: #fff; font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
  box-shadow: 0 8px 24px rgba(99, 119, 245, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  transition: transform 120ms, box-shadow 150ms;
}
.primary-button:not(:disabled):active { transform: scale(0.98); }
.primary-button:disabled { background: var(--space-lift); box-shadow: none; color: var(--text-dim); opacity: 1; }
.pill-button {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 24px;
  background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px;
  border: 1px solid rgba(123, 143, 255, 0.3);
}

/* ── Orbit screen ───────────────────────────────────────────────────────── */
.orbit-screen { position: absolute; inset: 0; }
.orbit-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.orbit-appbar {
  position: absolute; top: calc(var(--safe-top) + 10px); left: 0; right: 0;
  padding: 8px 20px; display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none;
}
.orbit-appbar > * { pointer-events: auto; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-secondary); }
.legend-item .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hc); box-shadow: 0 0 6px var(--hc); }
.legend-item.h-estranged .dot { background: var(--estranged-hl); box-shadow: none; }
.legend-count { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

.user-node {
  position: absolute; left: 50%; top: 87%;
  width: 48px; height: 48px; margin: -24px 0 0 -24px;
  pointer-events: none; z-index: 1;
}
.user-core {
  position: absolute; inset: 0; border-radius: 50%;
  display: grid; place-items: center; color: rgba(255, 255, 255, 0.92);
  background: radial-gradient(circle at 35% 30%, #C3CEFF, #6B7FFF 45%, #3446C8);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18) inset,
              0 0 0 6px rgba(123, 143, 255, 0.12),
              0 0 28px rgba(123, 143, 255, 0.45), 0 0 70px rgba(123, 143, 255, 0.18);
}
.user-pulse {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid rgba(123, 143, 255, 0.5);
  animation: pulse 3.2s var(--ease-out) infinite;
}
@keyframes pulse { from { transform: scale(1); opacity: 0.8; } to { transform: scale(2.6); opacity: 0; } }
.orbit-screen.is-empty .user-node { top: 87%; }

.fab {
  position: absolute; right: 18px; bottom: calc(var(--safe-bottom) + 84px);
  width: 52px; height: 52px; border-radius: 18px;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(180deg, var(--accent-fill-top), var(--accent-strong));
  box-shadow: 0 8px 24px rgba(99, 119, 245, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  z-index: 2; transition: transform 120ms;
}
.fab:active { transform: scale(0.94); }

.empty-state {
  position: absolute; top: 30%; left: 24px; right: 24px; text-align: center;
  display: grid; gap: 6px; justify-items: center;
}
.empty-orb {
  width: 64px; height: 64px; margin-bottom: 12px; border-radius: 50%;
  border: 1px dashed rgba(123, 143, 255, 0.4);
  background: radial-gradient(circle, rgba(123, 143, 255, 0.12), transparent 70%);
}
.empty-title { font: 400 22px/1.2 var(--serif); }

.bottom-nav {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: calc(76px + var(--safe-bottom));
  padding: 0 24px calc(var(--safe-bottom) + 10px);
  display: flex; justify-content: space-around; align-items: flex-end;
  background: linear-gradient(to bottom, rgba(7, 9, 15, 0), rgba(7, 9, 15, 0.96) 55%);
  z-index: 2;
}
.nav-item {
  position: relative; display: grid; justify-items: center; gap: 4px;
  min-width: 72px; min-height: 52px; align-content: end; padding-bottom: 4px;
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.02em;
  color: var(--text-secondary); opacity: 0.55; transition: opacity 150ms, color 150ms;
}
.nav-item:hover { opacity: 0.85; }
.nav-item.active { color: var(--accent); opacity: 1; }
.nav-item.active::before {
  content: ''; position: absolute; top: 2px; width: 32px; height: 32px; border-radius: 12px;
  background: var(--accent-soft); z-index: -1;
}

/* ── Pages ──────────────────────────────────────────────────────────────── */
.page-layer:empty, .overlay-layer:empty { display: none; }
.page {
  position: absolute; inset: 0; z-index: 3;
  background: radial-gradient(ellipse at 50% -10%, rgba(123, 143, 255, 0.08), transparent 55%), var(--space-void);
  display: flex; flex-direction: column;
  padding-top: var(--safe-top);
  animation: page-in 220ms var(--ease-out);
}
@keyframes page-in { from { opacity: 0; transform: translateY(10px); } }
.page.with-nav { padding-bottom: calc(76px + var(--safe-bottom)); }
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 12px; gap: 12px; min-height: 68px;
}
.page-header .spacer { width: 52px; }
.page-scroll { flex: 1; overflow-y: auto; padding: 4px 20px 24px; scrollbar-width: thin; scrollbar-color: var(--space-lift) transparent; }
.page-footer { padding: 8px 20px calc(var(--safe-bottom) + 16px); }

/* Add contact */
.add-contact .field-label { display: block; margin: 22px 0 8px; }
.add-contact .field-label:first-child { margin-top: 8px; }
.input {
  width: 100%; background: var(--space-lift);
  border: 1px solid var(--hairline); border-radius: 14px;
  padding: 13px 15px; color: var(--text-primary); font-size: 15px;
  outline: none; resize: none; transition: border-color 150ms, box-shadow 150ms;
}
.input::placeholder { color: var(--text-secondary); }
.input:focus { border-color: rgba(123, 143, 255, 0.55); box-shadow: 0 0 0 4px rgba(123, 143, 255, 0.1); }
.cadence-picker { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.stepper {
  display: flex; align-items: center; background: var(--space-lift);
  border: 1px solid var(--hairline); border-radius: 14px;
}
.stepper:focus-within { border-color: rgba(123, 143, 255, 0.55); }
.stepper button { width: 48px; height: 48px; color: var(--text-secondary); font-size: 18px; }
.stepper button:hover { color: var(--text-primary); }
.cadence-number {
  width: 40px; background: none; border: 0; outline: none; padding: 0;
  text-align: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.chips { display: flex; gap: 4px; padding: 4px; background: var(--space-lift); border: 1px solid var(--hairline); border-radius: 14px; }
.chip {
  flex: 1; border-radius: 10px; color: var(--text-secondary);
  font-size: 13px; min-height: 40px; transition: background 150ms, color 150ms;
  position: relative;
}
/* The group's 4px padding completes the 48px target. */
.chip::after { content: ''; position: absolute; inset: -4px 0; }
.chip:hover { color: var(--text-primary); }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px rgba(123, 143, 255, 0.35); }
.field-error { color: var(--danger); font-size: 12px; margin-top: 6px; }
.cadence-preview {
  display: flex; align-items: center; gap: 10px;
  margin-top: 10px; padding: 12px 14px; border-radius: 14px;
  background: linear-gradient(90deg, rgba(123, 143, 255, 0.1), transparent);
  border: 1px solid rgba(123, 143, 255, 0.15);
  color: var(--text-primary); font-size: 13.5px;
}
.cadence-preview .orbit-hint { color: var(--text-secondary); margin-left: auto; font-size: 12px; }
.field-label-row { display: flex; justify-content: space-between; align-items: baseline; }
.note-counter { font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.note-counter.near { color: var(--drifting-fg); }

/* Onboarding */
.onboarding { justify-content: space-between; padding: calc(var(--safe-top) + 56px) 24px calc(var(--safe-bottom) + 20px); overflow: hidden; }
.onboarding-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 62%; z-index: -1;
  -webkit-mask-image: linear-gradient(#000 85%, transparent); mask-image: linear-gradient(#000 85%, transparent); }
.onboarding-body { text-align: center; }
.onboarding-card { margin-top: auto; }
.onboarding-title { font: 400 52px/1 var(--serif); letter-spacing: -0.02em; text-shadow: 0 0 40px rgba(123, 143, 255, 0.35); }
.onboarding-tagline { margin-top: 12px; font: italic 400 21px/1.3 var(--serif); color: var(--text-secondary); }
.onboarding-card {
  padding: 20px 18px 6px; border-radius: 24px;
  background: rgba(20, 24, 38, 0.72); border: 1px solid var(--border);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.value-props { display: grid; gap: 14px; }
.value-prop { display: flex; gap: 12px; align-items: center; color: var(--text-primary); font-size: 14px; }
.value-icon {
  flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.onboarding-legend { justify-content: center; margin: 14px 0 4px; }
.onboarding-legend .legend-item.current { color: var(--text-primary); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.onboarding-top { position: absolute; top: calc(var(--safe-top) + 4px); right: 12px; }
.onboarding-progress { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; }
.progress-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); transition: width 200ms, background 200ms; }
.progress-dot.current { width: 18px; border-radius: 3px; background: var(--accent); }
.onboarding-step { min-height: 132px; }
.onboarding-step.enter { animation: onboarding-in 320ms ease-out; }
@keyframes onboarding-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.onboarding-heading { font: 400 24px/1.2 var(--serif); color: var(--text-primary); margin-bottom: 10px; }
.onboarding-heading.legend-item { display: flex; gap: 10px; font-size: 24px; color: var(--text-primary); }
.onboarding-heading.legend-item .dot { width: 12px; height: 12px; }
.onboarding-text { font-size: 14px; line-height: 1.5; color: var(--text-secondary); }
.onboarding-actions { display: flex; align-items: center; gap: 8px; margin: 14px 0 10px; }
.onboarding-actions .primary-button { flex: 1; }
.onboarding-back { flex: none; min-width: 64px; font-size: 14px; }

/* People */
.people-tools { display: grid; gap: 10px; margin-bottom: 16px; }
.people-search { position: relative; display: flex; align-items: center; }
.people-search > .icon-search { position: absolute; left: 14px; color: var(--text-secondary); pointer-events: none; display: flex; }
.people-search-input { padding-left: 42px; padding-right: 48px; min-height: 48px; }
/* Our own clear button replaces the WebKit one, so every browser gets the same control. */
.people-search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.search-clear {
  position: absolute; right: 0; width: 48px; height: 48px; display: grid; place-items: center;
  color: var(--text-secondary); border-radius: 14px;
}
.search-clear:hover { color: var(--text-primary); }
.people-empty { display: grid; justify-items: center; gap: 2px; padding: 32px 0; text-align: center; }
.people-group + .people-group { margin-top: 18px; }
.group-title {
  display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--hc);
}
.group-title .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hc); }
.group-count { color: var(--text-secondary); font-weight: 500; }
.person-row, .settings-row {
  width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
  padding: 12px 0; border-bottom: 1px solid var(--hairline); min-height: 60px;
}
.person-row:hover .person-name { color: #fff; }
.person-text { flex: 1; display: grid; gap: 5px; min-width: 0; }
.person-line { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.person-name { font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person-when { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.person-sub { font-size: 12px; color: var(--text-secondary); }
.settings-group { margin-top: 24px; }
.settings-group-title {
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-secondary); margin: 0 0 2px;
}
.settings-group-note { margin: 2px 0 0; }
.settings-list { margin-top: 4px; }
a.settings-row { color: inherit; text-decoration: none; }
.settings-row > .icon { flex: none; color: var(--text-secondary); }
.settings-row { cursor: pointer; }
.settings-row.danger { color: var(--danger); }
.app-version { margin-top: 24px; text-align: center; font-size: 12px; }

/* ── Health visuals ─────────────────────────────────────────────────────── */
.avatar {
  flex: none; width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 600; font-size: 22px; color: rgba(255, 255, 255, 0.92);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  background:
    radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.35), transparent 40%),
    radial-gradient(circle at 75% 80%, rgba(2, 3, 10, 0.45), transparent 60%),
    radial-gradient(circle at 35% 35%, var(--hc-hl), var(--hc-base));
  box-shadow: 0 0 22px color-mix(in srgb, var(--hc) 40%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--hc) 40%, transparent);
}
.avatar.h-estranged { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); }
.avatar.small { width: 38px; height: 38px; font-size: 14px; box-shadow: 0 0 12px color-mix(in srgb, var(--hc) 30%, transparent); }
.avatar.small.h-estranged { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); }
/* A photo fills the sphere; the health glow stays around it. */
.avatar.has-photo { overflow: hidden; background: var(--space-lift); }
.avatar-photo { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

/* Edit form: photo row */
.photo-field { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
.photo-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; flex: 1; }
.photo-button {
  min-height: 48px; padding: 0 14px; border-radius: 12px;
  color: var(--accent); font-size: 14px; font-weight: 600;
}
.photo-button:hover { background: var(--accent-soft); }

const SPEC_GEOMETRY_KEY = 'orbit.specGeometry';
const LAST_EXPORT_KEY = 'orbit.lastExport'; // ms of the last successful Export backup
const PLANET_STYLE_KEY = 'orbit.planetStyle'; // written by playground.html
const pref = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* ignore */ } },
  del: (k) => { try { localStorage.removeItem(k); } catch { /* ignore */ } },
};

// Set once storage has opened (see the end of this file). IndexedDB is async,
// so nothing reads people or history before then.
let repo = null;
const app = document.getElementById('app');
const go = (path) => { location.hash = path; };
const photoCache = photoUrls();
const photoUrlOf = (id) => photoCache.get(id, repo.getPhoto(id));

const healthOf = (c, now) => calculateHealth({
  cadenceDays: c.cadenceDays, now, createdAt: c.createdAt, lastEngagedAt: c.lastEngagedAt,
});

const ratioOf = (c, now) => cadenceRatio({
  cadenceDays: c.cadenceDays, now, lastEngagedAt: c.lastEngagedAt,
});

/** Brief confirmation that doesn't steal focus; announced politely. */
function toast(message) {
  const el = h('div', { class: 'toast', role: 'status' }, message);
  app.append(el);
  setTimeout(() => el.classList.add('leaving'), 2200);
  setTimeout(() => el.remove(), 2600);
}

// ── Orbit canvas (persistent) ─────────────────────────────────────────────
const navTo = (id) => go(id === 'orbit' ? '/' : `/${id}`);
const orbit = createOrbitScreen({
  onPlanetTap: (id) => go(`/contact/${id}`),
  onAdd: () => go('/add'),
  onSettings: () => go('/settings'),
  onNav: navTo,
  onSeedDemo: () => { if (repo) seedDemo(repo); },
});
orbit.setSpecGeometry(pref.get(SPEC_GEOMETRY_KEY) === '1');
const loadPlanetStyle = () => {
  try { return normalizeStyle(JSON.parse(pref.get(PLANET_STYLE_KEY))); } catch { return normalizeStyle(null); }
};
orbit.setPlanetStyle(loadPlanetStyle());
// The playground saves as you drag; an open app tab follows along.
window.addEventListener('storage', (e) => {
  if (e.key === PLANET_STYLE_KEY) orbit.setPlanetStyle(loadPlanetStyle());
});
const pageLayer = h('div', { class: 'page-layer' });
const overlayLayer = h('div', { class: 'overlay-layer' });
app.append(orbit.el, pageLayer, overlayLayer);

function refreshOrbit(contacts = repo.getAll()) {
  photoCache.keep(contacts.map((c) => c.id)); // let go of removed people's photos
  // Capture `now` per emission so health states never go stale.
  const now = Date.now();
  setDueBadge(dueCount(contacts, now)); // the home-screen icon badge, where supported
  const recentSince = now - 30 * 86_400_000;
  orbit.setContacts(separatePhases(contacts.map((c) => ({
    ...toOrbitData({ id: c.id, name: c.name, cadenceDays: c.cadenceDays, healthState: healthOf(c, now) }),
    createdAt: c.createdAt, // separatePhases keeps older planets in place
    lastEngagedAt: c.lastEngagedAt,
    ratio: ratioOf(c, now),
    moons: repo.getEngagementHistory(c.id).filter((e) => e.loggedAt >= recentSince).length,
  }))), HEALTH_LABELS);
}

// ── Router ────────────────────────────────────────────────────────────────
function parseRoute() {
  const path = location.hash.replace(/^#/, '') || '/';
  const m = path.match(/^\/contact\/([^/]+)$/);
  if (m) return { name: 'contact', id: decodeURIComponent(m[1]) };
  const edit = path.match(/^\/contact\/([^/]+)\/edit$/);
  if (edit) return { name: 'edit', id: decodeURIComponent(edit[1]) };
  const hist = path.match(/^\/history\/([^/]+)$/);
  if (hist) return { name: 'history', id: decodeURIComponent(hist[1]) };
  return { name: { '/': 'orbit', '/onboarding': 'onboarding', '/add': 'add', '/list': 'list',
    '/history': 'history', '/settings': 'settings' }[path] ?? 'orbit' };
}

let animateSheet = true;
let overlay = null; // transient modal state: 'log' | 'delete' (contact route), 'import' (settings),
//                     'engagement' | 'deleteEngagement' (history, for `editingId`)
let editingId = null; // the catch-up open for editing on History
let pendingImport = null; // a checked backup waiting for Merge/Replace
const NO_PEOPLE_SEARCH = { query: '', filter: 'all' };
let peopleSearch = NO_PEOPLE_SEARCH; // People search + chip filter; never saved, reset on leaving People
let onboardingPos = ONBOARDING_START; // the intro step; kept across re-renders, reset on leaving the intro

function render() {
  if (!repo) return; // storage still opening; the first watchAll call renders
  const route = parseRoute();
  if (route.name === 'orbit' && !pref.get(ONBOARDING_KEY)) return go('/onboarding');

  const now = Date.now();
  if (route.name !== 'list') peopleSearch = NO_PEOPLE_SEARCH;
  if (route.name !== 'onboarding') onboardingPos = ONBOARDING_START;
  // A re-render while typing in the People search (say, a write from another tab) keeps focus and caret.
  const typing = document.activeElement?.classList?.contains('people-search-input')
    ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  const page = renderPage(route, now);
  pageLayer.replaceChildren(...(page ? [page] : []));
  const search = typing && pageLayer.querySelector('.people-search-input');
  if (search) { search.focus({ preventScroll: true }); search.setSelectionRange(...typing); }
  orbit.el.inert = !!page;
  orbit.el.setAttribute('aria-hidden', String(!!page));

  overlayLayer.replaceChildren(...renderOverlays(route, now));
  // Move focus into the topmost surface (not onto its first button, which
  // would put a focus ring on an arbitrary control).
  const focusTarget = [...overlayLayer.querySelectorAll('.dialog, .sheet')].pop() ??
    pageLayer.querySelector('.page');
  if (focusTarget && !focusTarget.contains(document.activeElement)) {
    focusTarget.tabIndex = -1;
    focusTarget.focus({ preventScroll: true });
  }
}

function renderPage(route, now) {
  const markShown = () => pref.set(ONBOARDING_KEY, '1');
  switch (route.name) {
    case 'onboarding':
      return onboardingScreen({
        position: onboardingPos,
        onStep: (pos) => { onboardingPos = pos; },
        onDone: (next) => { markShown(); go(next === 'add' ? '/add' : '/'); },
      });
    case 'add':
      return addContactScreen({
        onCancel: () => go('/'),
        onSave: ({ name, cadenceDays, note }) => {
          repo.save({
            id: newId(), name, cadenceDays, note,
            createdAt: Date.now(),
            lastEngagedAt: null, // SA-001: never engaged → starts Drifting
          });
          go('/');
          toast(`${name} added to your orbit`);
        },
      });
    case 'edit': {
      const contact = repo.getById(route.id);
      if (!contact) { go('/'); return null; }
      const back = () => go(`/contact/${encodeURIComponent(contact.id)}`);
      return addContactScreen({
        contact,
        photo: { url: photoUrlOf(contact.id), available: repo.canStorePhotos(), healthState: healthOf(contact, now) },
        onCancel: back,
        onSave: ({ name, cadenceDays, note, photo }) => {
          // Through the repository, so createdAt, lastEngagedAt and the history stay as they are.
          repo.update(contact.id, { name, cadenceDays, note });
          let saved = 'Changes saved';
          try {
            if (photo === null) repo.removePhoto(contact.id);
            else if (photo) repo.setPhoto(contact.id, photo);
          } catch (e) { saved = `Changes saved, but not the photo: ${e.message}`; }
          back();
          toast(saved);
        },
      });
    }
    case 'list':
      return listScreen({
        rows: repo.getAll().map((c) => ({
          contact: c, healthState: healthOf(c, now), ratio: ratioOf(c, now), photoUrl: photoUrlOf(c.id),
        })),
        now, search: peopleSearch, onSearch: (next) => { peopleSearch = next; },
        onOpen: (id) => go(`/contact/${id}`), onNav: navTo, onAdd: () => go('/add'),
      });
    case 'history': {
      const contacts = repo.getAll();
      const names = Object.fromEntries(contacts.map((c) => [c.id, c.name]));
      const entries = repo.getEngagementHistory();
      const logged = new Set(entries.map((e) => e.contactId));
      const people = contacts.filter((c) => logged.has(c.id) || c.id === route.id) // keep the filtered person listed
        .sort((a, b) => a.name.localeCompare(b.name)).map(({ id, name }) => ({ id, name }));
      return historyScreen({
        entries, names, people, now,
        filterId: route.id && names[route.id] ? route.id : null,
        onFilter: (id) => go(id ? `/history/${encodeURIComponent(id)}` : '/history'),
        onEdit: (id) => { editingId = id; overlay = 'engagement'; render(); },
        onNav: navTo,
      });
    }
    case 'settings':
      return settingsScreen({
        onBack: () => go('/'),
        onSeedDemo: () => { seedDemo(repo); go('/'); },
        onReset: () => { overlay = 'erase'; render(); },
        onReplayOnboarding: () => { pref.del(ONBOARDING_KEY); go('/onboarding'); },
        onExport: exportBackup,
        lastExport: lastExportLabel(pref.get(LAST_EXPORT_KEY), Date.now()),
        onImport: (file) => file.text().then((text) => {
          let backup;
          try { backup = parseBackup(text); } catch (e) { toast(`Import failed: ${e.message}`); return; }
          pendingImport = {
            text, contacts: backup.contacts.length, engagements: backup.engagements.length, photos: backup.photos.size,
          };
          overlay = 'import';
          render();
        }, () => toast('Import failed: the file could not be read.')),
        specGeometry: pref.get(SPEC_GEOMETRY_KEY) === '1',
        onToggleSpec: (on) => {
          if (on) pref.set(SPEC_GEOMETRY_KEY, '1'); else pref.del(SPEC_GEOMETRY_KEY);
          orbit.setSpecGeometry(on);
        },
      });
    default:
      return null;
  }
}

async function exportBackup() {
  const now = Date.now();
  let json;
  try {
    json = JSON.stringify(await repo.exportData(now), null, 2);
  } catch { toast('Export failed: a photo could not be read'); return; }
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = h('a', { href: url, download: `orbit-backup-${new Date(now).toISOString().slice(0, 10)}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  pref.set(LAST_EXPORT_KEY, String(now));
  if (parseRoute().name === 'settings') render(); // the "Last exported" sub-line
  toast('Backup downloaded');
}

function renderOverlays(route, now) {
  if (route.name === 'settings' && overlay === 'erase') {
    return [confirmDialog({
      title: 'Erase all data?',
      body: 'This permanently removes every person, catch-up and photo from this browser. Export a backup first if you might want them back.',
      confirm: 'Erase',
      onCancel: () => { overlay = null; render(); },
      onConfirm: () => { overlay = null; repo.reset(); go('/'); toast('All data erased'); },
    })];
  }
  if (route.name === 'settings' && overlay === 'import' && pendingImport) {
    const close = () => { overlay = null; pendingImport = null; render(); };
    const apply = (mode) => {
      const { text } = pendingImport;
      overlay = null; pendingImport = null;
      try {
        const n = repo.importData(text, { mode });
        const skipped = n.photos > n.photosSaved ? ' (photos can’t be saved in this browser)' : '';
        toast(`Imported ${n.contacts} ${n.contacts === 1 ? 'person' : 'people'}${skipped}`);
      } catch (e) { toast(`Import failed: ${e.message}`); render(); }
    };
    return [importDialog({
      contacts: pendingImport.contacts, engagements: pendingImport.engagements, photos: pendingImport.photos,
      onCancel: close, onMerge: () => apply('merge'), onReplace: () => apply('replace'),
    })];
  }
  if (route.name === 'history' && editingId && (overlay === 'engagement' || overlay === 'deleteEngagement')) {
    return historyOverlay(now);
  }
  if (route.name !== 'contact') { overlay = null; pendingImport = null; editingId = null; return []; }
  const contact = repo.getById(route.id);
  const close = () => { overlay = null; go('/'); };
  const detail = contact && {
    contact,
    healthState: healthOf(contact, now),
    ratio: ratioOf(contact, now),
    history: repo.getEngagementHistory(contact.id),
    photoUrl: photoUrlOf(contact.id),
    now,
  };
  const layers = [detailSheet(detail, {
    onClose: close,
    onLog: () => { overlay = 'log'; render(); },
    onEdit: () => go(`/contact/${encodeURIComponent(contact.id)}/edit`),
    onDelete: () => { overlay = 'delete'; render(); },
    onHistory: () => go(`/history/${encodeURIComponent(contact.id)}`),
  })];
  // Only a freshly opened route slides the sheet in; in-route re-renders
  // (logging, cancelling a dialog) show it in place.
  if (!animateSheet) layers[0].classList.add('open', 'no-anim');
  animateSheet = false;

  if (contact && overlay === 'log') {
    layers.push(logSheet({
      onClose: () => { overlay = null; render(); },
      onPick: (type) => {
        overlay = null;
        repo.recordEngagement({ contactId: contact.id, type, loggedAt: Date.now() });
        toast(`${engagementType(type).label} · ${contact.name}`);
      },
    }));
  } else if (contact && overlay === 'delete') {
    layers.push(confirmDialog({
      title: `Remove ${contact.name}?`,
      body: 'This will permanently remove them and all engagement history.',
      confirm: 'Remove',
      onCancel: () => { overlay = null; render(); },
      onConfirm: () => {
        overlay = null; repo.delete(contact.id); go('/');
        toast(`${contact.name} removed`);
      },
    }));
  }
  return layers;
}

/** The edit sheet for a logged catch-up on History, or its delete confirmation. */
function historyOverlay(now) {
  const engagement = repo.getEngagementHistory().find((e) => e.id === editingId);
  const close = () => { overlay = null; editingId = null; render(); };
  if (!engagement) { overlay = null; editingId = null; return []; }
  const contact = repo.getById(engagement.contactId);
  const name = contact?.name ?? 'Removed';
  if (overlay === 'deleteEngagement') {
    return [confirmDialog({
      title: 'Delete this catch-up?',
      body: `${engagementType(engagement.type).label} with ${name} will be removed from the history.`,
      confirm: 'Delete',
      onCancel: () => { overlay = 'engagement'; render(); },
      onConfirm: () => {
        overlay = null; editingId = null;
        repo.deleteEngagement(engagement.id);
        toast('Catch-up deleted');
      },
    })];
  }
  return [editEngagementSheet({
    engagement, name, now,
    onClose: close,
    onSave: (changes) => {
      overlay = null; editingId = null;
      repo.updateEngagement(engagement.id, changes);
      toast('Catch-up updated');
    },
    onDelete: () => { overlay = 'deleteEngagement'; render(); },
    onOpenContact: () => { overlay = null; editingId = null; if (contact) go(`/contact/${encodeURIComponent(contact.id)}`); else render(); },
  })];
}

window.addEventListener('hashchange', () => {
  overlay = null;
  editingId = null;
  animateSheet = true;
  render();
});
window.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const route = parseRoute();
  if (overlay) { overlay = null; render(); } else if (route.name === 'contact') go('/');
  else if (route.name === 'edit') go(`/contact/${encodeURIComponent(route.id)}`);
  else if (['add', 'settings'].includes(route.name)) go('/');
});

// IndexedDB, moving the old localStorage data across on first run; localStorage
// when IndexedDB is unavailable. watchAll fires immediately (the first render)
// and again after every write.
openStorage({ onError: () => toast('Could not save changes in this browser') }).then((storage) => {
  repo = createRepository(storage);
  repo.watchAll((contacts) => { refreshOrbit(contacts); render(); });
  // Re-evaluate periodically so the SA-001 24h grace period lapses on its own.
  setInterval(() => refreshOrbit(), 60_000);
  // Back from the background the badge (and health) may be stale: an installed app can sit for days.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshOrbit();
  });
});

// Offline support for the deployed app (see sw.js) and the update banner. Opened from file:// or
// content:// there is nothing to cache, and from /src/ during development there is no sw.js.
const swEnabled = 'serviceWorker' in navigator && location.protocol.startsWith('http') && !location.pathname.includes('/src/');
startUpdates(app, swEnabled ? 'sw.js' : null, toast);
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
return {  };
})();
})();
  </script>
