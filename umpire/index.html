<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Umpire</title>
<meta name="description" content="Fair calls on repeated rule-breaking: log strikes against a limit and enforce the consequence when it is reached." />
<meta name="theme-color" content="#ECEFF3" />
<meta name="app-version" content="1.1.0 (e963b0637383)" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Umpire" />
<link rel="stylesheet" href="css/app.css" />
<script>
  // Apply the saved theme before first paint, so a chosen dark theme doesn't flash light.
  try { var t = localStorage.getItem('umpire-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="eyebrow">Fair calls, every time</span>
      <span class="title">Umpire</span>
    </a>
    <nav class="topnav">
      <a href="#/players">Players</a>
      <a href="#/settings">Settings</a>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div class="update-bar" id="updateBar" role="status" hidden>
  <span>A new version of Umpire is ready.</span>
  <button type="button" id="updateLater">Later</button>
  <button class="primary" type="button" id="updateReload">Reload</button>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dialog"></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
